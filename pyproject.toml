[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-forecasting-lab"
version = "0.1.0"
description = "Hourly energy-demand forecasting pipeline with ML baselines and a PyTorch LSTM model."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
